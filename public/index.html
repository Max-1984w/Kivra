<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kivra</title>
<style>
:root{color-scheme:dark;--bg:#0b0d09;--fg:#eef2e8;--mut:#9aa68f;--card:#14180f;--bd:#262d1f;--ac:#5f7a3d;--ac2:#b9cf9c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--ac)}
.aviso{background:var(--ac);color:#fff;text-align:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-weight:600;font-size:14px}
nav{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.on{border-color:var(--ac);color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:16px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card .b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pr{font-weight:700;font-size:18px}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.modal{position:fixed;inset:0;background:#0008;display:flex;justify-content:center;overflow:auto;padding:16px}
.modal>div{background:var(--bg);border-radius:12px;padding:16px;max-width:460px;width:100%;margin:auto}
.err{color:#d33;font-size:13px;min-height:16px}
.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 8px}
.vale{font-size:20px;font-weight:700;padding:16px 8px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.sc{overflow-x:auto}
.bv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1c2511,#3f5229);font-weight:700;color:#dbe8c8}
.ban{height:clamp(120px,28vw,240px);border-radius:14px;background:linear-gradient(120deg,#1c2511,#5f7a3d) center/cover;border:1px solid var(--bd)}
.perfil{display:flex;gap:14px;align-items:flex-end;margin:-44px 16px 14px;position:relative}
.av{width:96px;height:96px;flex:0 0 96px;border-radius:50%;border:4px solid var(--bg);object-fit:cover;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800}
a{color:var(--ac2)}button.on{color:var(--ac2);border-color:var(--ac2)}
.hero{position:relative;border-radius:14px;overflow:hidden;min-height:400px;color:#fff;background:radial-gradient(ellipse at 50% 35%,#3f5229,#0c0c0e 72%);border:1px solid var(--bd)}
.sl{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 64px 56px;gap:12px}
.sl.on{display:flex}
.k{letter-spacing:.3em;font-size:13px;color:#dbe8c8}
.h{font-size:clamp(34px,8vw,64px);font-weight:800;line-height:1.05}
.cp{border:1px solid #dbe8c866;border-radius:12px;padding:10px 22px;max-width:440px}
.hb{background:#fff;color:#111;border:0;font-weight:700;letter-spacing:.08em;padding:12px 28px}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:#ffffff33;border:0;color:#fff;font-size:20px;padding:0;z-index:2}
.ctl{position:absolute;left:16px;bottom:14px;display:flex;gap:8px;align-items:center;z-index:2}
.dt{width:8px;height:8px;border-radius:50%;background:#fff6;padding:0;border:0}.dt.on{width:28px;border-radius:6px;background:#fff}
.ps{width:28px;height:28px;border-radius:50%;background:#ffffff33;border:0;color:#fff;padding:0;font-size:12px}
.app{margin:16px 0;border-radius:12px;background:linear-gradient(90deg,#1c2511,#5f7a3d);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 22px;color:#fff}
.app button{background:#fff;color:#111;border:0;font-weight:700}
</style></head><body>
<div class="aviso">vendemos para todo o Brasil com entregas a negociar pelo chat do app, compras feitas para fora do pais não seram reembolsadas</div>
<nav id="nav"></nav><main id="app"></main><footer class="mut" style="text-align:center;padding:24px 16px"><a href="#" data-x="go" data-v="priv">Política de Privacidade</a> · Kivra</footer><div id="mod"></div><div id="mod2"></div>
<script>
const CL={roupas:'Roupas',bolsas:'Bolsas',cosmeticos:'Cosméticos',calcados:'Calçados',perfumes:'Perfumes',servicos:'Serviços',vale_presente:'Vale presente'};
const NEED={roupas:['tam'],calcados:['tam'],bolsas:[],perfumes:['nome'],cosmeticos:['nome'],servicos:[]};
const $=s=>document.querySelector(s),app=$('#app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
const digits=s=>String(s||'').replace(/\D/g,'');
const dt=t=>new Date(t).toLocaleString('pt-BR');
const MET={pix:'Pix',credito:'Cartão de crédito',debito:'Cartão de débito',cartao:'Cartão'},ST={pendente:'⏳ Aguardando',aprovado:'✅ Aprovado',recusado:'❌ Recusado'};
const val=i=>$('#'+i)?.value.trim();
async function api(u,m='GET',b){
 const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 let d={};try{d=await r.json()}catch(e){}
 if(!r.ok)throw new Error(d.erro||'Erro no servidor ('+r.status+')');return d}
function img(file,max=700){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(file)})}
const inp=(id,l,v='',a='')=>`<label>${l}</label><input id="${id}" value="${esc(v)}" ${a}>`;
const bt=(x,t,d='',c='')=>`<button class="${c}" data-x="${x}" ${d}>${t}</button>`;

const UF=[['AC','Acre'],['AL','Alagoas'],['AP','Amapá'],['AM','Amazonas'],['BA','Bahia'],['CE','Ceará'],['DF','Distrito Federal'],['ES','Espírito Santo'],['GO','Goiás'],['MA','Maranhão'],['MT','Mato Grosso'],['MS','Mato Grosso do Sul'],['MG','Minas Gerais'],['PA','Pará'],['PB','Paraíba'],['PR','Paraná'],['PE','Pernambuco'],['PI','Piauí'],['RJ','Rio de Janeiro'],['RN','Rio Grande do Norte'],['RS','Rio Grande do Sul'],['RO','Rondônia'],['RR','Roraima'],['SC','Santa Catarina'],['SP','São Paulo'],['SE','Sergipe'],['TO','Tocantins']],CID={};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pk=(t,c)=>{$('#mod2').innerHTML=`<div class="modal"><div><h3 style="margin-top:0">${t}</h3>${c}<br>${bt('fechar2','Voltar')}</div></div>`};
let cidLista=null;
let eu={logado:false},view='inicio',arg=null,tab='loja',Q={q:'',classe:'',min:'',max:''},P={},ord='recentes',modo='entrar',cur=null,ar='cliente',ct=null,loadMsgs=null;
function go(v,a){if(v=='loja')lt='inicio';view=v;arg=a;draw()}
function nav(){
 const b=(v,t)=>`<button data-x="go" data-v="${v}" class="${view==v?'on':''}">${t}</button>`;
 $('#nav').innerHTML=b('inicio','🏠 Início')+b('prod','🔎 Produtos')+(eu.logado?b('meus','Meus pedidos'):'')+
  (eu.papel=='vendedor'?b('vend','🏪 Minha loja'):'')+(eu.papel=='admin'?b('adm','🛡️ ADM'):'')+
  (eu.logado?bt('sair','Sair'):bt('area','Entrar / Criar conta','data-ar="cliente"')+bt('area','🏪 Área do vendedor','data-ar="vendedor"','p'));
}
async function draw(){nav();try{await({inicio:vInicio,prod:vProd,loja:vLoja,meus:vMeus,conta:vConta,vend:vVend,adm:vAdm,priv:vPriv})[view]()}catch(e){app.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
async function init(){try{eu=await api('/api/eu')}catch(e){}
 const q=new URLSearchParams(location.search),l=q.get('loja'),mp=q.get('mp'),pg=q.get('pagamento');
 history.replaceState(null,'',location.pathname+(l?'?loja='+encodeURIComponent(l):''));
 if(mp){alert(mp=='ok'?'Conta do Mercado Pago conectada! Seus clientes já podem pagar online.':'Não foi possível conectar o Mercado Pago. Tente de novo.');return go(eu.papel=='vendedor'?'vend':'inicio')}
 if(pg){alert(pg=='ok'?'Pagamento recebido! O pedido é aprovado automaticamente quando o Mercado Pago confirmar.':pg=='pendente'?'Pagamento pendente. Assim que for confirmado, o pedido é aprovado.':'O pagamento não foi concluído. Você pode tentar de novo em Meus pedidos.');return go(eu.logado?'meus':'inicio')}
 l?go('loja',l):go('inicio')}

/* ---------- vitrine ---------- */
function card(p,del){P[p.id]=p;return `<div class="card">${p.foto?`<img src="${p.foto}" alt="">`:`<div class="ph">Serviço</div>`}<div class="b">${p.nome?`<b>${esc(p.nome)}</b>`:''}<span class="mut">${CL[p.classe]}${p.tamanho?' · Tam. '+esc(p.tamanho):''}</span><div>${esc(p.descricao)}</div><div class="pr">${brl(p.preco)}</div>${p.slug&&!del?`<a href="#" class="mut" data-x="go" data-v="loja" data-a="${p.slug}">🏪 ${esc(p.loja_nome)}</a>`:''}${del?`${p.classe=='servicos'?'':`<span class="mut">Estoque: ${p.estoque}</span><div class="row"><input type="number" min="0" value="${p.estoque}" id="e${p.id}" style="margin:0">${bt('estoque','Atualizar',`data-id="${p.id}"`)}</div>`}${bt('delprod','Excluir',`data-id="${p.id}"`)}`:`${bt('buy','Comprar',`data-id="${p.id}"`,'p')}`}</div></div>`}
let sl=0,tm=null,pausa=false,dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
function slide(n){const s=document.querySelectorAll('.sl');if(!s.length)return;sl=(n+s.length)%s.length;s.forEach((e,i)=>e.classList.toggle('on',i==sl));document.querySelectorAll('.dt').forEach((e,i)=>e.classList.toggle('on',i==sl))}
async function vInicio(){
 const [av,lj,bi]=await Promise.all([api('/api/inicio'),api('/api/lojas'),api('/api/banner/info')]);
 const S=[{k:'ROUPAS • CALÇADOS • BOLSAS • PERFUMES',s:'COSMÉTICOS • VALE PRESENTE',h:'Kivra',c:'Compre direto das melhores lojas',b:'COMPRAR',v:'prod'},
  ...av.filter(a=>a.tipo=='promocao').slice(0,5).map(a=>({k:a.loja_nome.toUpperCase(),s:'PROMOÇÃO',h:a.titulo,c:a.texto,b:'VER LOJA',v:'loja',a:a.slug}))];
 const es=av.filter(a=>a.tipo=='estoque');
 sl=0;
 app.innerHTML=`<div class="hero">${bi.video?`<video class="bv" src="/api/banner/video?v=${bi.versao}" autoplay muted loop playsinline></video>`:''}${S.map((x,i)=>`<div class="sl ${i?'':'on'}"><div class="k">${esc(x.k)}</div><div class="k">${esc(x.s)}</div><div class="h">${esc(x.h)}</div>${x.c?`<div class="cp">${esc(x.c)}</div>`:''}<button class="hb" data-x="go" data-v="${x.v}" ${x.a?`data-a="${x.a}"`:''}>${x.b}</button></div>`).join('')}
 ${S.length>1?`<button class="ar" style="left:12px" data-x="pass" data-n="-1">‹</button><button class="ar" style="right:12px" data-x="pass" data-n="1">›</button>`:''}
 <div class="ctl">${S.map((x,i)=>`<button class="dt ${i?'':'on'}" data-x="dot" data-i="${i}"></button>`).join('')}<button class="ps" data-x="pausa">⏸</button></div></div>
 <div class="app"><div><b>Instale o app Kivra</b><div style="opacity:.85">Tenha tudo em um só lugar, no computador ou no celular.</div></div><button data-x="instalar">Instalar</button></div>
 ${lj.length?`<h3>Lojas</h3><div class="row" style="margin-bottom:14px">${lj.map(l=>`<button data-x="go" data-v="loja" data-a="${l.slug}" style="flex:0 0 auto">🏪 ${esc(l.nome)}</button>`).join('')}</div>`:''}
 ${es.length?`<h3>Atualizações de estoque</h3>`+es.map(a=>`<div class="box"><span class="tag">📦 Estoque</span> <b>${esc(a.titulo)}</b><div>${esc(a.texto)}</div><div class="mut"><a href="#" data-x="go" data-v="loja" data-a="${a.slug}">${esc(a.loja_nome)}</a> · ${new Date(a.criado).toLocaleDateString('pt-BR')}</div></div>`).join(''):''}`;
 clearInterval(tm);tm=setInterval(()=>{if(!pausa&&view=='inicio')slide(sl+1)},5000);
}
async function vInicioOld(){
 const [av,lj,bi]=await Promise.all([api('/api/inicio'),api('/api/lojas'),api('/api/banner/info')]);
 app.innerHTML=`<h1 style="margin:6px 0">Kivra</h1><p class="mut">Promoções, atualizações de estoque e lojas parceiras.</p>${lj.length?`<div class="row" style="margin-bottom:14px">${lj.map(l=>`<button data-x="go" data-v="loja" data-a="${l.slug}" style="flex:0 0 auto">🏪 ${esc(l.nome)}</button>`).join('')}</div>`:''}`+
 (av.length?av.map(a=>`<div class="box"><span class="tag">${a.tipo=='estoque'?'📦 Estoque':'🏷️ Promoção'}</span> <b>${esc(a.titulo)}</b><div>${esc(a.texto)}</div><div class="mut"><a href="#" data-x="go" data-v="loja" data-a="${a.slug}">${esc(a.loja_nome)}</a> · ${new Date(a.criado).toLocaleDateString('pt-BR')}</div></div>`).join(''):'<p class="mut">Ainda não há novidades.</p>');
}
async function vProd(){
 const sel=Object.entries(CL).map(([k,n])=>`<option value="${k}" ${Q.classe==k?'selected':''}>${n}</option>`).join('');
 let lista='';
 if(Q.classe=='vale_presente'){const lj=await api('/api/lojas');lista=`<p class="mut">Escolha a loja para comprar o vale presente:</p><div class="row">${lj.map(l=>`<button data-x="go" data-v="loja" data-a="${l.slug}" style="flex:0 0 auto">🏪 ${esc(l.nome)}</button>`).join('')}</div>`}
 else{const l=await api('/api/produtos?'+new URLSearchParams(Q));lista=l.length?`<div class="grid">${l.map(p=>card(p)).join('')}</div>`:'<p class="mut">Nenhum produto encontrado.</p>'}
 app.innerHTML=`<div class="box"><label>Pesquisar</label><input id="q" value="${esc(Q.q)}" placeholder="Nome ou descrição"><div class="row"><div><label>Classe</label><select id="cl"><option value="">Todas</option>${sel}</select></div><div><label>Preço mínimo</label><input id="mn" inputmode="decimal" value="${esc(Q.min)}"></div><div><label>Preço máximo</label><input id="mx" inputmode="decimal" value="${esc(Q.max)}"></div></div>${bt('buscar','Buscar','','p')}</div>`+lista;
}
let lt='inicio';
async function vLoja(){
 const [l,ps]=await Promise.all([api('/api/lojas/'+arg),api('/api/produtos?loja='+arg)]);
 const f=l.faixa_preco||{},cb=(c='')=>bt('chatloja','💬 Conversar com a loja',`data-id="${l.id}" data-t="${esc(l.nome)}"`,c);
 const T=[['inicio','Início'],['prod','Produtos ('+ps.length+')'],['vale','Vale presente']];
 const grade=a=>a.length?`<div class="grid">${a.map(p=>card(p)).join('')}</div>`:'<p class="mut">Sem produtos no momento.</p>';
 const body=lt=='prod'?grade(ps):lt=='vale'?`<div class="grid">${l.vales.map(v=>`<button class="vale p" data-x="vale" data-loja="${l.id}" data-v="${v}">R$ ${v}</button>`).join('')}</div><p class="mut">Não achou o valor que queria? Converse com a loja:</p>${cb()}`:
  `<div class="box"><b>Quem somos nós?</b><p>${esc(l.quem_somos)||'<span class="mut">A loja ainda não preencheu esta seção.</span>'}</p>${f.min!=null?`<span class="tag">Produtos de ${brl(f.min)} a ${brl(f.max)}</span>`:''}</div>${ps.length?'<h3>Destaques</h3>'+grade(ps.slice(0,4)):''}<br>${cb('p')}`;
 app.innerHTML=`<div class="ban" ${l.banner?`style="background-image:url('${l.banner}')"`:''}></div><div class="perfil">${l.avatar?`<img class="av" src="${l.avatar}" alt="">`:`<div class="av">${esc(l.nome.charAt(0).toUpperCase())}</div>`}<div><h2 style="margin:0">${esc(l.nome)}</h2><span class="mut">${ps.length} produtos</span></div></div><div class="row" style="margin-bottom:14px">${T.map(([k,n])=>bt('ltab',n,`data-t="${k}"`,lt==k?'on':'')).join('')}</div>${body}`;
}
async function vMeus(){
 const o=await api('/api/meus-pedidos');
 app.innerHTML='<h3>Meus pedidos</h3>'+(o.length?o.map(x=>`<div class="box"><b>#${x.id} · ${esc(x.item)}</b> · ${brl(x.preco)}<br><span class="tag">${MET[x.metodo]||x.metodo}</span> <span class="tag">${ST[x.status]||x.status}</span><br><span class="mut">${esc(x.loja_nome||'')} · ${dt(x.criado)}</span><div class="row" style="margin-top:8px">${bt('chat','💬 Conversar',`data-id="${x.id}" data-t="${esc(x.item)}"`)}${x.metodo=='pix'&&x.status=='pendente'?bt('compmodal',x.tem_comp?'Reenviar comprovante':'Enviar comprovante',`data-id="${x.id}"`):''}${x.mp&&x.status=='pendente'&&x.preco>0?bt('pagarmp','Pagar com Mercado Pago',`data-id="${x.id}"`,'p'):''}</div></div>`).join(''):'<p class="mut">Você ainda não fez pedidos.</p>');
}
function pedido(it){
 cur={it};
 const end=it.vale?'<p class="mut">O vale presente não precisa de endereço. Quando o vendedor aprovar o pagamento, o código chega no chat.</p>'
  :`<label>Estado</label><input id="f_uf" readonly placeholder="Toque para escolher o estado" data-x="pickuf" style="cursor:pointer"><label>Cidade</label><input id="f_ci" readonly placeholder="Toque para escolher a cidade" data-x="pickcid" style="cursor:pointer">${inp('f_cep','CEP','','inputmode="numeric" maxlength="9"')}${inp('f_ba','Bairro')}${inp('f_ru','Rua')}${inp('f_nu','Número da casa')}${inp('f_cu','Cupom de desconto (opcional)')}${inp('f_va','Código do vale presente (opcional)')}`;
 $('#mod').innerHTML=`<div class="modal"><div><h3 style="margin-top:0">Finalizar pedido</h3><div class="mut">${esc(it.nome)} · ${brl(it.preco)}</div><br><label>Forma de pagamento</label><select id="f_m"><option value="pix">Pix</option><option value="credito">Cartão de crédito</option><option value="debito">Cartão de débito</option></select>${inp('f_n','Nome completo')}${inp('f_te','Telefone com DDD','','inputmode="tel"')}${end}<div class="err" id="er"></div><div class="row">${bt('fechar','Cancelar')}${bt('enviar','Continuar','','p')}</div></div></div>`;
}
function fin(r,it,m){
 cur.pid=r.id;
 const mp=r.mp&&r.total>0?`<div class="box"><b>Pagar agora pelo Mercado Pago</b><p class="mut">Pix, cartão de crédito ou débito. O pedido é aprovado automaticamente quando o pagamento for confirmado.</p>${bt('pagarmp','Pagar com Mercado Pago',`data-id="${r.id}"`,'p')}</div><p class="mut">Ou, se preferir, combine direto com o vendedor:</p>`:'';
 const pg=m=='pix'?(r.pix?`<div class="box"><div class="mut">Chave Pix do vendedor</div><div style="font-size:18px;font-weight:700;word-break:break-all;margin:6px 0">${esc(r.pix)}</div>${bt('copiarpix','Copiar chave',`data-l="${esc(r.pix)}"`,'p')}</div><label>Depois de pagar, anexe a foto do comprovante</label><input id="cp" type="file" accept="image/*"><div class="err" id="er"></div>${bt('comp','Enviar comprovante',`data-id="${r.id}"`,'p')}`:'<div class="box">O vendedor ainda não cadastrou a chave Pix. Fale com ele pelo chat.</div>')
  :`<div class="box"><b>Pagamento no cartão de ${m=='credito'?'crédito':'débito'}</b><p>Entre em contato com o vendedor para acertar o pagamento. Quando vocês combinarem, ele aprova o seu pedido.</p></div>`;
 $('#mod').innerHTML=`<div class="modal"><div><h3 style="margin-top:0">Pedido #${r.id} criado ✅</h3><p>Total: <b>${brl(r.total)}</b></p>${mp}${pg}<div class="row" style="margin-top:12px">${bt('chat','💬 Conversar com o vendedor',`data-id="${r.id}" data-t="${esc(it.nome)}"`,'p')}</div>${it.vale?'<p>Assim que o vendedor aprovar o pagamento, o código do vale chega no chat. Use o código no campo "Código do vale presente" ao comprar nesta loja.</p>':''}<p class="mut">Acompanhe em "Meus pedidos".</p>${bt('fechar','Fechar')}</div></div>`;
}

Dependendo da utilização da plataforma, a Kivra poderá tratar:

### 2.1. Dados de cadastro

Os dados pessoais poderão ser utilizados para:

* Criar e administrar contas;
* Permitir o funcionamento das lojas;
* Processar pedidos;
* Permitir a comunicação entre compradores e lojistas;
* Auxiliar no processamento de pagamentos;
* Permitir entregas;
* Prestar suporte;
* Manter e melhorar a plataforma;
* Garantir a segurança;
* Detectar e prevenir fraudes;
* Identificar atividades suspeitas;
* Cumprir obrigações legais;
* Exercer direitos em processos judiciais, administrativos ou arbitrais;
* Enviar comunicações relacionadas ao funcionamento da plataforma;
* Enviar comunicações promocionais quando houver base legal adequada;
* Realizar análises estatísticas e melhorias no serviço.

Os dados não serão tratados para finalidades incompatíveis com aquelas informadas ao titular.

## 4. BASES LEGAIS

O tratamento de dados pessoais poderá ocorrer com fundamento nas hipóteses previstas na LGPD, incluindo, conforme o caso:

* Execução de contrato;
* Cumprimento de obrigação legal ou regulatória;
* Exercício regular de direitos;
* Legítimo interesse;
* Consentimento;
* Proteção do crédito, quando aplicável;
* Outras hipóteses previstas na legislação.

Quando o tratamento depender de consentimento, este deverá ser obtido de forma livre, informada e inequívoca.

## 5. DADOS DOS CLIENTES DAS LOJAS

A Kivra funciona como plataforma para diferentes lojas.

Quando um comprador realizar uma compra em determinada loja, os dados necessários para processamento e cumprimento do pedido poderão ser disponibilizados ao respectivo lojista.

O lojista poderá ser responsável pelo tratamento dos dados que receber e utilizar para suas próprias finalidades, devendo observar a legislação aplicável.

A Kivra poderá estabelecer regras específicas para que os lojistas utilizem os dados de seus clientes de maneira adequada e segura.

## 6. COMPARTILHAMENTO DE DADOS

Os dados poderão ser compartilhados, quando necessário, com:

* Lojistas responsáveis pelas lojas;
* Processadores e intermediadores de pagamento;
* Empresas de logística e entrega;
* Provedores de hospedagem;
* Serviços de armazenamento;
* Serviços de infraestrutura tecnológica;
* Serviços de segurança;
* Serviços necessários para comunicação;
* Prestadores necessários à operação da plataforma;
* Autoridades públicas quando houver obrigação legal ou determinação válida.

O compartilhamento será limitado ao necessário para a finalidade correspondente.

A Kivra **não comercializa dados pessoais como produto**.

## 7. PAGAMENTOS

Os pagamentos poderão ser realizados por meio de instituições financeiras, gateways, adquirentes ou outros intermediadores especializados.

Quando terceiros forem responsáveis pelo processamento do pagamento, os dados necessários para a realização da transação poderão ser enviados a esses terceiros.

A Kivra não solicita senhas bancárias dos usuários.

Quando o pagamento for processado diretamente por um terceiro, a Kivra poderá não ter acesso aos dados completos do cartão utilizado na transação.

## 8. COOKIES

A Kivra poderá utilizar cookies e tecnologias semelhantes para:

* Manter sessões de usuários;
* Permitir o funcionamento da plataforma;
* Armazenar preferências;
* Melhorar desempenho;
* Reforçar a segurança;
* Produzir estatísticas;

## 9. SEGURANÇA DOS DADOS

A Kivra adotará medidas técnicas e administrativas razoáveis para proteger os dados pessoais contra:

* Acessos não autorizados;
* Perda;
* Destruição;
* Alteração;
* Divulgação indevida;
* Tratamento inadequado ou ilícito.

As medidas poderão incluir controle de acesso, autenticação, proteção da infraestrutura, backups, monitoramento e outras medidas de segurança compatíveis com a natureza dos dados tratados.

Apesar das medidas adotadas, nenhum sistema conectado à internet pode ser considerado completamente seguro.

Caso ocorra um incidente de segurança que possa acarretar risco ou dano relevante aos titulares, serão adotadas as providências exigidas pela legislação e pelas normas aplicáveis.

Os dados pessoais serão mantidos pelo período necessário para cumprir as finalidades para as quais foram coletados.

* Exercício regular de direitos;
* Cumprimento de obrigações contratuais;
* Prevenção de fraudes;
* Segurança da plataforma;
* Outras hipóteses permitidas pela legislação.

Quando não houver fundamento legal para a manutenção dos dados, eles poderão ser eliminados, anonimizados ou submetidos a outra forma de tratamento permitida pela legislação.

## 11. DIREITOS DOS TITULARES

Nos termos da LGPD, o titular poderá exercer seus direitos, observadas as condições e exceções previstas em lei.

Entre esses direitos estão:

* Confirmar a existência de tratamento;
* Solicitar acesso aos seus dados;
* Solicitar correção de dados incompletos, inexatos ou desatualizados;
* Solicitar anonimização, bloqueio ou eliminação de dados tratados de forma desnecessária ou irregular;
* Solicitar informações sobre compartilhamento;
* Solicitar informações sobre a finalidade do tratamento;
* Revogar consentimentos anteriormente fornecidos, quando aplicável;
* Solicitar eliminação de dados tratados com base no consentimento, ressalvadas as hipóteses legais de conservação;
* Solicitar portabilidade, quando aplicável e regulamentada;
* Opor-se a determinados tratamentos quando cabível;
* Solicitar revisão de decisões tomadas exclusivamente com base em tratamento automatizado, quando aplicável.

## 12. COMO SOLICITAR SEUS DIREITOS

Solicitações relacionadas aos dados pessoais poderão ser realizadas pelo seguinte canal:

**E-mail:** kivra.plataforma.de.vendas@gmail.com

**E-mail:** kivra.plataforma.de.vendas@gmail.com

## 14. CRIANÇAS E ADOLESCENTES

A Kivra busca proteger crianças e adolescentes e observar o princípio do melhor interesse no tratamento de seus dados pessoais.

Quando houver tratamento de dados de crianças, serão observadas as exigências específicas previstas na LGPD e demais normas aplicáveis, inclusive aquelas relacionadas ao consentimento de pais ou responsáveis quando exigido.

A Kivra poderá adotar medidas para evitar a coleta desnecessária de dados de crianças e adolescentes.

A Kivra poderá enviar mensagens necessárias para:

Comunicações promocionais serão realizadas somente quando houver fundamento legal adequado.

O cancelamento de mensagens promocionais não impedirá o envio de comunicações necessárias ao funcionamento da conta ou à execução de serviços contratados.

## 16. RESPONSABILIDADES DOS LOJISTAS

Os lojistas que utilizam a Kivra são responsáveis pelas operações de tratamento que realizarem diretamente com os dados de seus clientes.

Os lojistas deverão:

* Utilizar os dados somente para finalidades legítimas;

A Kivra poderá adotar medidas administrativas ou técnicas para proteger os usuários e a plataforma caso identifique utilização inadequada dos dados.

A Kivra poderá utilizar fornecedores especializados para hospedagem, armazenamento, pagamentos, segurança, comunicação, análise, logística e outras atividades necessárias ao funcionamento da plataforma.

Esses fornecedores poderão tratar dados pessoais somente na medida necessária para a prestação dos serviços correspondentes e conforme as obrigações legais e contratuais aplicáveis.

Determinados fornecedores tecnológicos utilizados pela Kivra poderão realizar tratamento ou armazenamento de dados fora do Brasil.

Quando ocorrer transferência internacional de dados pessoais, a Kivra buscará observar os requisitos estabelecidos pela LGPD e pelas normas da ANPD aplicáveis à transferência internacional.

Esta Política de Privacidade poderá ser atualizada para refletir:

* Lei nº 13.709/2018 — Lei Geral de Proteção de Dados Pessoais (LGPD);

function md(t){
 const il=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g,'<a href="mailto:$1">$1</a>');
 let o='',ul=false;
 for(const l of t.split('\n')){
  const b=l.startsWith('* ');
  if(ul&&!b){o+='</ul>';ul=false}
  if(b){if(!ul){o+='<ul>';ul=true}o+='<li>'+il(l.slice(2))+'</li>'}
  else if(l.startsWith('### '))o+='<h4>'+il(l.slice(4))+'</h4>';
  else if(l.startsWith('## '))o+='<h3>'+il(l.slice(3))+'</h3>';
  else if(l.startsWith('# '))o+='<h2>'+il(l.slice(2))+'</h2>';
  else if(l.startsWith('---'))o+='<hr>';
  else if(l.trim())o+='<p>'+il(l)+'</p>';
 }
 return o+(ul?'</ul>':'')}

 $('#tb').innerHTML=`<label>Ordenar</label><select id="od" style="max-width:220px"><option value="recentes">Mais recentes</option><option value="antigos">Mais antigos</option></select>`+(o.length?o.map(x=>`<div class="box"><b>🔔 #${x.id} · ${esc(x.item)}</b> · ${brl(x.preco)} <span class="tag">${MET[x.metodo]||x.metodo}</span> <span class="tag">${ST[x.status]||x.status}</span>${x.cupom?` <span class="tag">cupom ${esc(x.cupom)}</span>`:''}<br><span class="mut">${dt(x.criado)}</span><p style="margin:8px 0 0"><b>${esc(x.nome)}</b> · ${esc(x.telefone)}${x.rua?`<br>${esc(x.rua)}, ${esc(x.numero)} — ${esc(x.bairro)}, ${esc(x.cidade)}${x.estado?'/'+esc(x.estado):''} · CEP ${esc(x.cep)}`:'<br><span class="mut">Vale presente — sem endereço de entrega</span>'}</p>${x.comprovante?`<img src="${x.comprovante}" style="width:90px;border-radius:8px;margin-top:8px;cursor:pointer" data-x="zoom">`:(x.metodo=='pix'?'<p class="mut">Comprovante do Pix ainda não enviado.</p>':'')}<div class="row" style="margin-top:8px">${bt('chat','💬 Chat',`data-id="${x.id}" data-t="${esc(x.item)}"`)}${x.status=='pendente'?bt('status','✅ Aprovar',`data-id="${x.id}" data-s="aprovado"`,'p')+bt('status','❌ Recusar',`data-id="${x.id}" data-s="recusado"`):''}</div></div>`).join(''):'<p class="mut">Nenhum pedido ainda.</p>');
 $('#od').value=ord;
}
async function tConv(){
 const l=await api('/api/vendedor/conversas');
 $('#tb').innerHTML='<p class="mut">Clientes que escreveram para a loja antes de comprar. As conversas dos pedidos ficam em Pedidos.</p>'+(l.length?l.map(x=>`<div class="box row" style="align-items:center"><div><b>${esc(x.email)}</b><div class="mut">${dt(x.ultima)}</div></div>${bt('chatconv','💬 Abrir',`data-id="${x.cliente_id}" data-t="${esc(x.email)}"`)}</div>`).join(''):'<p class="mut">Nenhuma conversa ainda.</p>');
}
async function tRel(){$('#tb').innerHTML=relTab(await api('/api/vendedor/relatorio'))}
const relTab=r=>`<div class="box sc"><table><tr><th>Período</th><th>Vendas</th><th>Total</th></tr>${[['mes','Mês'],['bimestre','Bimestre'],['trimestre','Trimestre'],['ano','Ano']].map(([k,n])=>`<tr><td>${n}</td><td>${r[k].vendas}</td><td>${brl(r[k].total)}</td></tr>`).join('')}</table></div>`;

/* ---------- ADM ---------- */
async function vAdm(){
 const [u,r,bi]=await Promise.all([api('/api/admin/usuarios'),api('/api/admin/relatorio'),api('/api/banner/info')]);
 app.innerHTML=`<h3>Vídeo do banner inicial</h3><div class="box">${bi.video?`<video src="/api/banner/video?v=${bi.versao}" muted loop autoplay playsinline style="width:100%;max-height:200px;border-radius:10px;object-fit:cover"></video><p class="mut">Vídeo atual do banner.</p>`:'<p class="mut">Sem vídeo: o banner usa o fundo padrão.</p>'}<label>Enviar novo vídeo (MP4 ou WebM, curto, até 12 MB)</label><input id="vd" type="file" accept="video/mp4,video/webm"><div class="err" id="er"></div><div class="row">${bt('upvideo','Enviar vídeo','','p')}${bi.video?bt('delvideo','Remover vídeo'):''}</div></div><h3>Relatório de vendas (todas as lojas)</h3>${relTab(r)}<h3>Usuários</h3><div class="sc box"><table><tr><th>E-mail</th><th>Tipo</th><th>Loja</th><th></th></tr>${u.map(x=>`<tr><td>${esc(x.email)}</td><td>${x.papel}${x.bloqueado?' 🚫':''}</td><td>${esc(x.loja||'')}</td><td>${x.papel=='admin'?'':bt('bloq',x.bloqueado?'Desbloquear':'Bloquear',`data-id="${x.id}" data-b="${x.bloqueado?0:1}"`)+' '+bt('deluser','Excluir',`data-id="${x.id}"`)}</td></tr>`).join('')}</table></div>`;
}

/* ---------- ações (um clique = uma função) ---------- */
const A={
 go:d=>go(d.v,d.a),
 pagarmp:async d=>{const r=await api(`/api/pedidos/${d.id}/pagar-mp`,'POST');location.href=r.url},
 mpconectar:async()=>{const r=await api('/api/vendedor/mp/conectar');location.href=r.url},
 mpdesc:async()=>{if(confirm('Desconectar o Mercado Pago? Os clientes voltam a pagar combinando com você.')){await api('/api/vendedor/mp/desconectar','POST');eu=await api('/api/eu');tLoja()}},
 upvideo:async()=>{const f=$('#vd').files[0];if(!f)throw new Error('Escolha um vídeo.');if(f.size>12*1024*1024)throw new Error('Vídeo grande demais (máximo 12 MB).');
  const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
  $('#er').textContent='Enviando...';await api('/api/admin/banner-video','POST',{video:d});vAdm()},
 delvideo:async()=>{if(confirm('Remover o vídeo do banner?')){await api('/api/admin/banner-video','DELETE');vAdm()}},
 pickuf:()=>pk('Escolha o estado',`<div style="max-height:60vh;overflow:auto">${[...UF].sort((a,b)=>a[1].localeCompare(b[1],'pt-BR')).map(([s,n])=>`<button style="width:100%;text-align:left;margin-bottom:6px" data-x="setuf" data-u="${s}" data-n="${n}">${n} (${s})</button>`).join('')}</div>`),
 setuf:d=>{cur.uf={sigla:d.u,nome:d.n};$('#f_uf').value=`${d.n} (${d.u})`;$('#f_ci').value='';A.fechar2()},
 pickcid:async()=>{
  if(!cur.uf)throw new Error('Escolha primeiro o estado.');
  const u=cur.uf.sigla,tit='Cidades de '+cur.uf.nome;pk(tit,'<p class="mut">Carregando cidades...</p>');
  let c=CID[u];
  if(!c){try{const r=await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${u}/municipios?orderBy=nome`);if(!r.ok)throw 0;c=(await r.json()).map(x=>x.nome).sort((a,b)=>a.localeCompare(b,'pt-BR'));CID[u]=c}
   catch(e){pk('Cidade','<p class="mut">Não foi possível carregar a lista. Digite o nome da cidade:</p><input id="pm">'+bt('setcid','Confirmar','data-m="1"','p'));return}}
  pk(tit,'<input id="pq" placeholder="Buscar cidade..." autocomplete="off"><div id="pl" style="max-height:55vh;overflow:auto"></div>');
  cidLista=q=>{const f=c.filter(n=>norm(n).includes(norm(q)));$('#pl').innerHTML=f.map(n=>`<button style="width:100%;text-align:left;margin-bottom:6px" data-x="setcid" data-n="${esc(n)}">${esc(n)}</button>`).join('')||'<p class="mut">Nenhuma cidade encontrada.</p>'};
  cidLista('');
 },
 setcid:d=>{const n=d.m?val('pm'):d.n;if(!n)throw new Error('Digite a cidade.');$('#f_ci').value=n;A.fechar2()},
 fechar2:()=>{$('#mod2').innerHTML=''},
 privmodal:()=>{$('#mod').innerHTML=`<div class="modal"><div style="max-width:720px">${polHTML()}<br>${bt('fechar','Fechar')}</div></div>`},
 area:d=>{ar=d.ar;modo=ar=='vendedor'?'ventrar':'entrar';go('conta')},
 pass:d=>slide(sl+Number(d.n)),
 dot:d=>slide(Number(d.i)),
 pausa:(d,t)=>{pausa=!pausa;t.textContent=pausa?'▶':'⏸'},
 instalar:()=>{if(dp){dp.prompt();dp=null}else alert('Para instalar: no iPhone, toque em Compartilhar e depois em "Adicionar à Tela de Início". No Android ou no Windows, abra o menu do navegador e escolha "Instalar app" ou "Adicionar à tela inicial".')},
 buscar:()=>{Q={q:val('q'),classe:val('cl'),min:val('mn'),max:val('mx')};draw()},
 buy:d=>{if(!eu.logado){alert('Crie uma conta ou entre para comprar.');return A.area({ar:'cliente'})}const p=P[d.id];pedido({id:p.id,nome:p.nome||CL[p.classe],preco:p.preco,loja_id:p.loja_id})},
 vale:d=>{if(!eu.logado){alert('Crie uma conta ou entre para comprar.');return A.area({ar:'cliente'})}pedido({vale:Number(d.v),loja_id:Number(d.loja),nome:'Vale presente R$ '+d.v,preco:Number(d.v)})},
 chat:d=>chat(`/api/pedidos/${d.id}/mensagens`,d.t),
 chatloja:d=>{if(!eu.logado){alert('Crie uma conta ou entre para conversar com a loja.');return A.area({ar:'cliente'})}chat(`/api/lojas/${d.id}/mensagens`,d.t)},
 chatconv:d=>chat(`/api/vendedor/conversas/${d.id}/mensagens`,d.t),
 compartilhar:async d=>{if(navigator.share){try{await navigator.share({title:'Minha loja',text:'Conheça a minha loja:',url:d.l})}catch(e){}}else A.copiar(d)},
 msg:async d=>{const t=val('mt');if(!t)return;await api(d.u,'POST',{texto:t});$('#mt').value='';await loadMsgs()},
 copiarpix:async d=>{try{await navigator.clipboard.writeText(d.l);alert('Chave Pix copiada!')}catch(e){prompt('Copie a chave Pix:',d.l)}},
 comp:async d=>{const f=$('#cp')?.files[0];if(!f)throw new Error('Escolha a foto do comprovante.');await api(`/api/pedidos/${d.id}/comprovante`,'PUT',{comprovante:await img(f,900)});alert('Comprovante enviado! O vendedor vai conferir e aprovar o seu pedido.');if(view=='meus'){A.fechar();vMeus()}else $('#cp').value=''},
 compmodal:d=>{$('#mod').innerHTML=`<div class="modal"><div><h3 style="margin-top:0">Comprovante do Pix</h3><input id="cp" type="file" accept="image/*"><div class="err" id="er"></div><div class="row">${bt('fechar','Cancelar')}${bt('comp','Enviar',`data-id="${d.id}"`,'p')}</div></div></div>`},
 status:async d=>{if(!confirm(d.s=='aprovado'?'Aprovar este pedido?':'Recusar este pedido?'))return;await api(`/api/vendedor/pedidos/${d.id}/status`,'POST',{status:d.s});tPed()},
 fechar:()=>{clearInterval(ct);$('#mod').innerHTML='';$('#mod2').innerHTML=''},
 zoom:(d,t)=>{$('#mod').innerHTML=`<div class="modal"><div><img src="${t.src}" style="width:100%"><br><br><button data-x="fechar" style="width:100%">Fechar</button></div></div>`},
 enviar:async()=>{
  const {it}=cur,m=val('f_m');
  const r=await api('/api/pedidos','POST',{produto_id:it.id,loja_id:it.loja_id,vale_valor:it.vale,metodo:m,nome:val('f_n'),telefone:val('f_te'),estado:cur.uf?.sigla,cidade:val('f_ci'),cep:val('f_cep'),bairro:val('f_ba'),rua:val('f_ru'),numero:val('f_nu'),cupom:val('f_cu'),vale_codigo:val('f_va')});
  fin(r,it,m);
 },
 modo:d=>{modo=d.m;vConta()},
 conta:async()=>{
  if(modo=='entrar'||modo=='ventrar')await api('/api/login','POST',{email:val('e'),senha:$('#s').value});
  else{if(!$('#ac').checked)throw new Error('Aceite a Política de Privacidade para criar a conta.');await api('/api/cadastro','POST',{aceite:true,email:val('e'),senha:$('#s').value,confirmar:$('#s2').value,tipo:modo=='vend'?'vendedor':'cliente',cpf:val('cpf'),nomeLoja:val('nl')})}
  eu=await api('/api/eu');if(ar=='vendedor'&&eu.papel=='cliente')alert('Esta conta é de cliente. Para vender, crie uma conta em "Criar minha loja".');go(eu.papel=='vendedor'?'vend':eu.papel=='admin'?'adm':'inicio');
 },
 sair:async()=>{await api('/api/logout','POST');eu={logado:false};go('inicio')},
 tab:d=>{tab=d.t;vVend()},
 ltab:d=>{lt=d.t;vLoja()},
 salvarloja:async()=>{const a=$('#av').files[0],b=$('#bn').files[0];await api('/api/vendedor/loja','PUT',{nome:val('ln'),quem_somos:$('#qs').value,pix:val('px'),avatar:a?await img(a,400):undefined,banner:b?await img(b,1200):undefined});eu=await api('/api/eu');$('#er').textContent='Salvo ✔'},
 copiar:async d=>{try{await navigator.clipboard.writeText(d.l);alert('Link copiado!')}catch(e){prompt('Copie o link:',d.l)}},
 addprod:async()=>{const f=$('#ft').files[0];if(!f&&val('cl')!='servicos')throw new Error('Adicione a foto.');await api('/api/vendedor/produtos','POST',{classe:val('cl'),nome:val('nm'),tamanho:val('tm'),descricao:val('d'),preco:parseInt(digits(val('pr'))||'0',10)/100,estoque:val('es'),foto:f?await img(f):undefined});tProd()},
 estoque:async d=>{await api(`/api/vendedor/produtos/${d.id}/estoque`,'PUT',{estoque:$('#e'+d.id).value});tProd()},
 delprod:async d=>{if(confirm('Excluir produto?')){await api('/api/vendedor/produtos/'+d.id,'DELETE');tProd()}},
 addcup:async()=>{await api('/api/vendedor/cupons','POST',{codigo:val('cc'),tipo:val('ct'),valor:val('cv').replace(',','.')});tCup()},
 delcup:async d=>{await api('/api/vendedor/cupons/'+d.id,'DELETE');tCup()},
 addvale:async()=>{const r=await api('/api/vendedor/vales','POST',{valor:val('vv')});alert('Vale emitido! Código: '+r.codigo);tVale()},
 addavi:async()=>{await api('/api/vendedor/avisos','POST',{tipo:val('at'),titulo:val('ati'),texto:$('#atx').value});$('#er').textContent='Publicado ✔'},
 bloq:async d=>{await api(`/api/admin/usuarios/${d.id}/bloqueio`,'POST',{bloqueado:d.b=='1'});vAdm()},
 deluser:async d=>{if(confirm('Excluir este usuário e os dados dele?')){await api('/api/admin/usuarios/'+d.id,'DELETE');vAdm()}},
};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-x]');if(!t)return;e.preventDefault();
 try{await A[t.dataset.x](t.dataset,t)}catch(err){const er=$('#er');er?er.textContent=err.message:alert(err.message)}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='mt'){e.preventDefault();document.querySelector('[data-x=msg]')?.click()}});
document.addEventListener('input',e=>{if(e.target.id=='pr'){const c=parseInt(digits(e.target.value)||'0',10);e.target.value='R$ '+(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}if(e.target.id=='pq'&&cidLista)cidLista(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id=='od'){ord=e.target.value;tPed()}});
init();
</script></body></html>
